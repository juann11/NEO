<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icono de NEO: fuente de todos los tamaños (npx tauri icon). Misma paleta que src/neo/neo-look.ts -->
  <defs>
    <linearGradient id="cuerpo" x1="0.8" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="luz" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="#020617" stroke="#1E293B" stroke-width="8"/>
  <line x1="512" y1="330" x2="512" y2="200" stroke="#475569" stroke-width="30" stroke-linecap="round"/>
  <circle cx="512" cy="188" r="42" fill="#4ADE80" filter="url(#luz)"/>
  <rect x="176" y="300" width="672" height="520" rx="240" fill="url(#cuerpo)" stroke="rgba(148,163,184,0.6)" stroke-width="16"/>
  <rect x="246" y="470" width="532" height="220" rx="96" fill="url(#visor)"/>
  <line x1="340" y1="506" x2="580" y2="506" stroke="rgba(255,255,255,0.18)" stroke-width="12" stroke-linecap="round"/>
  <g fill="#4ADE80" filter="url(#luz)">
    <rect x="370" y="520" width="84" height="120" rx="42"/>
    <rect x="570" y="520" width="84" height="120" rx="42"/>
  </g>
</svg>
